{{define "card"}}
<div class="card" id="card-{{.ID}}">
    <span class="card-title">{{.Title}}</span>
    <button class="btn-delete"
            hx-delete="/cards/{{.ID}}"
            hx-target="#card-{{.ID}}"
            hx-swap="delete"
            hx-confirm="Delete this card?">×</button>
</div>
{{end}}
