{{define "card_edit"}}
<div class="card card-editing" id="card-{{.ID}}">
    <form hx-patch="/cards/{{.ID}}" hx-target="#card-{{.ID}}" hx-swap="outerHTML">
        <input type="text" name="title" value="{{.Title}}" autofocus
               hx-get="/cards/{{.ID}}" hx-trigger="keyup[key=='Escape']"
               hx-target="#card-{{.ID}}" hx-swap="outerHTML">
        <div class="edit-actions">
            <button type="submit">Save</button>
            <button type="button"
                    hx-get="/cards/{{.ID}}"
                    hx-target="#card-{{.ID}}"
                    hx-swap="outerHTML">Cancel</button>
        </div>
    </form>
</div>
{{end}}

{{define "card_edit_error"}}
<div class="card card-editing" id="card-{{.ID}}">
    <form hx-patch="/cards/{{.ID}}" hx-target="#card-{{.ID}}" hx-swap="outerHTML">
        <input type="text" name="title" value="{{.Title}}" autofocus
               hx-get="/cards/{{.ID}}" hx-trigger="keyup[key=='Escape']"
               hx-target="#card-{{.ID}}" hx-swap="outerHTML">
        <p class="error">Title cannot be empty</p>
        <div class="edit-actions">
            <button type="submit">Save</button>
            <button type="button"
                    hx-get="/cards/{{.ID}}"
                    hx-target="#card-{{.ID}}"
                    hx-swap="outerHTML">Cancel</button>
        </div>
    </form>
</div>
{{end}}
